name: Auditoría de accesibilidad

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL HTTPS pública a analizar'
        required: true
        default: 'https://albafotonica.com/servicios/'
        type: string

permissions:
  contents: read

jobs:
  auditar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar URL
        env:
          TARGET_URL: ${{ inputs.url }}
        run: |
          node - <<'NODE'
          const u = new URL(process.env.TARGET_URL);
          if (u.protocol !== 'https:' || u.username || u.password || u.port ||
              !u.hostname.includes('.') || u.hostname === 'localhost' ||
              /^(?:127|10|0|192\.168)\./.test(u.hostname)) {
            throw Error('Introduce una URL HTTPS pública válida');
          }
          NODE

      - name: Instalar Pa11y y Puppeteer
        run: npm install --no-save pa11y puppeteer

      - name: Capturar página y ejecutar ambos motores
        env:
          TARGET_URL: ${{ inputs.url }}
        run: node scripts/auditar.cjs

      - name: Guardar informes durante un día
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-wcag-${{ github.run_number }}
          path: resultados/
          retention-days: 1
          if-no-files-found: warn
