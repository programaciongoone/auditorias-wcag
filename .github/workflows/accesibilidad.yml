name: Auditoría de accesibilidad

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL pública a analizar (https://...)'
        required: true
        default: 'https://albafotonica.com/'
        type: string

permissions:
  contents: read

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar URL pública
        env:
          TARGET_URL: ${{ inputs.url }}
        run: |
          node - <<'NODE'
          const { URL } = require('node:url');
          const url = new URL(process.env.TARGET_URL);
          if (url.protocol !== 'https:' || url.username || url.password || url.port || !url.hostname.includes('.') || url.hostname === 'localhost') {
            throw new Error('Introduce una URL HTTPS pública sin credenciales ni puerto personalizado');
          }
          NODE

      - name: Instalar Pa11y
        run: npm install --global pa11y

      - name: Ejecutar auditoría WCAG 2.1 AA
        id: audit
        shell: bash
        env:
          TARGET_URL: ${{ inputs.url }}
        run: |
          set +e
          pa11y "$TARGET_URL" --config ./pa11y.config.cjs --reporter json > informe-accesibilidad.json
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -ne 0 ] && [ "$EXIT_CODE" -ne 2 ]; then
            echo 'ERROR: Pa11y no pudo completar el análisis.' >&2
            exit 1
          fi
          node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('informe-accesibilidad.json', 'utf8'));
          if (!Array.isArray(data)) throw new Error('Informe JSON no válido');
          console.log(`Incidencias encontradas: ${data.length}`);
          NODE

      - name: Guardar informe JSON durante un día
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-accesibilidad-${{ github.run_number }}
          path: informe-accesibilidad.json
          retention-days: 1
          if-no-files-found: warn
